[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "test-codecov"
version = "0.1.0"
description = "A minimal Python library for testing pytest coverage uploads to Codecov."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "test-codecov maintainers" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/test_codecov"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["test_codecov"]

[tool.coverage.report]
show_missing = true
skip_covered = false

